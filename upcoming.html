<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BHM Family | Upcoming Events</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --glass-bg: rgba(255,255,255,0.15);
  --glass-border: rgba(255,255,255,0.3);
  --glass-highlight: rgba(255,255,255,0.6);
  --accent:#ff007f;
  --text-light:#fff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#000;
  color:var(--text-light);
}

/* HERO */
.hero{
  position:relative;
  min-height:100vh;
  padding:30px;
  display:flex;
  flex-direction:column;
}

.hero img.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.4),rgba(0,0,0,.85));
  z-index:-1;
}

/* NAV */
.nav-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  backdrop-filter:blur(50px) saturate(250%);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:16px;
  padding:12px 24px;
  box-shadow:inset 0 1px 0 var(--glass-highlight),0 8px 24px rgba(0,0,0,.3);
}

.logo{
  font-size:1.4rem;
  font-weight:900;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin:0 12px;
  font-weight:600;
}

nav a:hover{color:var(--accent)}

button{
  background:#fff;
  color:#000;
  border:none;
  padding:10px 20px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}

/* HERO CONTENT */
.hero-content{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-content p{
  font-size:1.8rem;
  font-weight:600;
}

.hero-content h1{
  font-size:4.2rem;
  font-weight:900;
}

/* EVENTS */
.section{
  padding:60px 20px;
}

.events-title{
  text-align:center;
  font-size:2.6rem;
  font-weight:900;
  margin-bottom:40px;
}

.events-grid{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

/* EVENT CARD */
.event-card{
  backdrop-filter:blur(25px) saturate(150%);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:18px;
  padding:25px;
  transition:.3s;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.event-card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 30px 60px rgba(0,0,0,.55);
}

.event-date{
  font-size:.9rem;
  color:var(--accent);
  font-weight:700;
}

.event-title{
  font-size:1.4rem;
  font-weight:900;
  margin:10px 0;
}

.event-location{
  font-size:.95rem;
  opacity:.9;
}

.event-desc{
  font-size:.95rem;
  margin:14px 0;
  opacity:.85;
}

.event-btn{
  display:inline-block;
  margin-top:12px;
  padding:10px 18px;
  background:#fff;
  color:#000;
  border-radius:8px;
  font-weight:700;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  margin-top:40px;
}

@media(max-width:768px){
  .hero-content h1{font-size:2.6rem}
  .hero-content p{font-size:1.2rem}
  .nav-bar{flex-direction:column;gap:12px}
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img class="bg" src="C:/Users/udula/Downloads/d.png" alt="Background">

  <div class="nav-bar">
    <div class="logo">BHM Family</div>
    <nav>
      <a href="#">Home</a>
      <a href="#events">Events</a>
    </nav>
    <button>All Members</button>
  </div>

  <div class="hero-content">
    <p>Don’t Miss Out</p>
    <h1>Upcoming Events</h1>
  </div>
</section>

<!-- EVENTS -->
<section class="section" id="events">
  <div class="events-title">Upcoming Events</div>

  <div class="events-grid">

    <div class="event-card">

      <div class="event-desc"></div>
      <a href="1s.html" class="event-btn">View Details</a>
    </div>

    <div class="event-card">
      <div class="event-date">COMING SOON</div>
      <div class="event-title"></div>
      <div class="event-location">📍</div>
      <div class="event-desc"></div>
      <a href="1s.html" class="event-btn">View Details</a>
    </div>

    <div class="event-card">
      <div class="event-date">COMING SOON</div>
      <div class="event-title"></div>
      <div class="event-location">📍</div>
      <div class="event-desc"></div>
      <a href="1s.html" class="event-btn">View Details</a>
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  <p style="font-weight:600;">© 2026 The Official BHM Family Website</p>
  <p>Developed by Udula Herath</p>
</footer>

</body>
</html>
