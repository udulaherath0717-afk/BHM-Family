<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BHM Event Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --glass-bg: rgba(255,255,255,0.15);
  --glass-border: rgba(255,255,255,0.3);
  --glass-highlight: rgba(255,255,255,0.6);
  --accent:#ff007f;
  --text-light:#fff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#000;
  color:#fff;
}

/* HERO */
.hero{
  position:relative;
  min-height:100vh;
  padding:30px;
}

.hero img.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,.9));
  z-index:-1;
}

/* NAV */
.nav-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  backdrop-filter:blur(50px) saturate(250%);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:16px;
  padding:12px 24px;
}

.logo{font-weight:900;font-size:1.3rem}

nav a{
  color:#fff;
  text-decoration:none;
  margin:0 12px;
  font-weight:600;
}

nav a:hover{color:var(--accent)}

/* CONTENT */
.content{
  max-width:1000px;
  margin:80px auto;
  padding:30px;
  backdrop-filter:blur(30px);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:20px;
}

.content h1{
  font-size:3rem;
  font-weight:900;
}

.event-meta{
  margin:20px 0;
  font-size:1.1rem;
  opacity:.9;
}

.content p{
  margin-top:20px;
  line-height:1.8;
  opacity:.9;
}

.back-btn{
  display:inline-block;
  margin-top:30px;
  padding:12px 22px;
  background:#fff;
  color:#000;
  font-weight:700;
  border-radius:10px;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px;
  margin-top:60px;
}

@media(max-width:768px){
  .content h1{font-size:2.2rem}
}
</style>
</head>

<body>

<section class="hero">
  <img class="bg" src="C:/Users/udula/Downloads/glass-multicolor-5k-3840x2160-11963.png">

  <div class="nav-bar">
    <div class="logo">BHM Family</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
    </nav>
  </div>

  <div class="content">
    <h1>COMING SOON</h1>

    <div class="event-meta">
      📅 Date: <b>COMING SOON</b><br>
      📍 Location: <b>COMING SOON</b>
    </div>

    <p>
COMING SOON
    </p>

    <a href="upcoming.html" class="back-btn">← Back to Events</a>
  </div>
</section>

<footer>
  <p>© 2026 BHM Family | Developed by Udula Herath</p>
</footer>

</body>
</html>
